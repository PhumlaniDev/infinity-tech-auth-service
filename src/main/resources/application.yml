spring:
  application:
    name: auth-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888/}         # ← top level, no profile condition
    cloud:
      config:
        uri: http://config-server:8888
        fail-fast: true               # ← fail loudly if config-server unreachable
        retry:
          max-attempts: 6
          initial-interval: 1000
          max-interval: 2000
          multiplier: 1.1