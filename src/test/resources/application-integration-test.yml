spring:
  cloud:
    config:
      enabled: false
      
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost/disable
  
  cache:
    type: none

keycloak:
  auth-server-url: http://localhost:8080
  realm: test-realm
  resource: auth-service
  credentials:
    secret: test_secret
  admin:
    username: test-admin
    password: test-admin
  logout_uri: http://localhost:8080/realms/test-realm/protocol/openid-connect/logout
  principle-attribute: preferred_username

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
logging:
  level:
    com.phumlanidev.authservice: DEBUG
    org.hibernate.SQL: DEBUG
    org.testcontainers: WARN