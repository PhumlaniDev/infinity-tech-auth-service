spring:
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false

  datasource:
#    url: jdbc:tc:postgresql:16-alpine:///auth_test_db   # Testcontainers JDBC URL
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
      
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9999/realms/ecommerce
          jwk-set-uri: http://localhost:9999/realms/ecommerce/protocol/openid-connect/cert
  
  cache:
    type: none

keycloak:
  auth-server-url: http://localhost:9999
  realm: ecommerce
  resource: auth-service-client
  credentials:
    secret: test-client-secret
  admin:
    client-id: auth-service-admin
    client-secret: test-admin-client-secret
  logout_uri: http://localhost:9999/realms/ecommerce/protocol/openid-connect/logout
  principle-attribute: preferred_username

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

spring.cloud.config.enabled: false
spring.cloud.config.import-check.enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health