name: CI Workflow

permissions:
  issues: read
  contents: read
  actions: read
  pull-requests: read

on:
  workflow_dispatch:
  pull_request:
    branches: [ develop, main ]
  push:
    branches: [ develop, main ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      actions: read
      contents: read
    uses: PhumlaniDev/reusable-workflows/.github/workflows/java-maven-build-test.yml@main
    with:
      postgres-db: auth_db
    secrets: inherit

  sast:
    needs: build
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: PhumlaniDev/reusable-workflows/.github/workflows/java-maven-sast.yml@main
    secrets: inherit

  docker:
    needs: [build, sast]
    permissions:
      actions: read
      contents: read
    uses: PhumlaniDev/reusable-workflows/.github/workflows/java-maven-docker.yml@main
    with:
      project_name: auth-service
      target: ci
    secrets: inherit

  sca:
    needs: docker
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: PhumlaniDev/reusable-workflows/.github/workflows/java-maven-sca.yml@main
    with:
      image_tag: ${{ needs.docker.outputs.image_tag }}
      project_name: auth-service
    secrets: inherit

  #  dast:
  #    needs: build
  #    name: Dynamic Application Security Testing (DAST)
  #    uses: PhumlaniDev/reusable-workflows/.github/workflows/dast.yml@main
  #    secrets:
  #      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  #      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
  #    with:
  #      image-tag: '${{ secrets.DOCKERHUB_USERNAME }}/infinity-auth-service:latest'

  notify:
    needs: [ build, sast, docker, sca ]
    if: always()
    uses: PhumlaniDev/reusable-workflows/.github/workflows/discord-notify.yml@main
    with:
      # Colour is derived from this status inside the reusable workflow.
      status: >-
        ${{ contains(needs.*.result, 'failure') && 'failure'
        || contains(needs.*.result, 'cancelled') && 'cancelled'
        || 'success' }}
      title: "🚀 auth-service CI"
      description: |
        Build (incl. Checkstyle): `${{ needs.build.result }}`
        SAST: `${{ needs.sast.result }}`
        Docker: `${{ needs.docker.result }}`
        SCA: `${{ needs.sca.result }}`
        Branch: `${{ github.ref_name }}`
        [View commit](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
    secrets:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}